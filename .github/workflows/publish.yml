name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv build

      - name: Smoke test wheel
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "No wheel found in dist/" }
          Write-Host "Smoke testing: $wheel"
          uv run --isolated --no-project --with "$wheel" python -c "import auto_ft; print(auto_ft.__name__)"

      - name: Publish (OIDC)
        run: uv publish
